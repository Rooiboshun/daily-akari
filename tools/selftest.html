<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>UI selftest</title>
    <!-- 本番と同じ見た目で走らせる（このページを開けば目でも確かめられる） -->
    <link rel="stylesheet" href="../src/style.css" />
  </head>
  <body>
    <!--
      本物の index.html の中身をそのまま取り込んで UI を動かし、実際の click /
      contextmenu を投げて結果を #result に書く。tools/uitest.mjs が
      ヘッドレス Chrome でこのページを開いて JSON を読む。
    -->
    <pre id="result">{"ok":false,"note":"まだ走っていません"}</pre>
    <div id="app"></div>

    <script type="module">
      const results = [];
      const check = (name, cond, detail = '') => results.push({ name, ok: !!cond, detail: String(detail) });
      // ヘッドレスでは requestAnimationFrame が一度も来ないので、
      // 待ちはタイマーだけで作る（UI 側も rAF に頼り切らない作りにしてある）。
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const settle = (n = 4) => sleep(80 * n);
      const $ = (id) => document.getElementById(id);
      const click = (node, type = 'click') =>
        node.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true }));

      const DATE = '2026-09-01';
      const LEVEL = 'easy';

      function finish(fatal) {
        const ok = !fatal && results.every((r) => r.ok);
        $('result').textContent = JSON.stringify({ ok, fatal: fatal || null, results });
        document.title = ok ? 'SELFTEST-OK' : 'SELFTEST-NG';
      }

      window.addEventListener('error', (e) => finish(`未捕捉のエラー: ${e.message}`));

      try {
        // 1. 本物の index.html の body を取り込む（script は import で自分で読む）
        const html = await fetch('../index.html').then((r) => r.text());
        const doc = new DOMParser().parseFromString(html, 'text/html');
        for (const s of doc.querySelectorAll('script')) s.remove();
        $('app').replaceChildren(...doc.body.children);

        location.hash = `#${DATE}/${LEVEL}`;
        localStorage.clear();

        const akari = await import('../src/akari.js');
        await import('../src/ui.js');
        await settle();

        // 2. 盤面が描けているか
        const made = akari.dailyPuzzle(DATE, LEVEL);
        const n = made.puzzle.w * made.puzzle.h;
        const cells = $('board').querySelectorAll('.cell');
        check('盤面のマス数が問題と一致', cells.length === n, `${cells.length} / ${n}`);
        const whites = made.puzzle.cells.reduce((a, c) => a + (c === akari.WHITE ? 1 : 0), 0);
        check(
          '白マスの数が一致',
          $('board').querySelectorAll('.cell.white').length === whites,
          `${$('board').querySelectorAll('.cell.white').length} / ${whites}`,
        );
        check('「作っています」が消えている', $('busy').classList.contains('hidden'));
        check(
          '手つかずの盤面を間違い扱いしない',
          $('state').textContent.startsWith('未点灯') && !$('state').classList.contains('ng'),
          $('state').textContent,
        );

        const cellAt = (i) => $('board').querySelector(`.cell.white[data-i="${i}"]`);
        const lampCells = [];
        for (let i = 0; i < n; i++) if (made.solution[i] === akari.LAMP) lampCells.push(i);

        // 3. 右クリックで×印
        const someWhite = made.puzzle.cells.findIndex((c) => c === akari.WHITE);
        click(cellAt(someWhite), 'contextmenu');
        await settle(1);
        check('右クリックで×印が付く', cellAt(someWhite).classList.contains('mark'));
        click(cellAt(someWhite), 'contextmenu');
        await settle(1);
        check('もう一度で×印が消える', !cellAt(someWhite).classList.contains('mark'));

        // 4. 照らし合いが赤くなる（同じ行の白マス2つに置く）
        let pairA = -1;
        let pairB = -1;
        const ix = akari.buildIndex(made.puzzle);
        for (const i of ix.whites) {
          const beam = ix.beams[i];
          if (beam.length > 1) {
            pairA = i;
            pairB = beam[1];
            break;
          }
        }
        click(cellAt(pairA));
        click(cellAt(pairB));
        await settle(1);
        check('照らし合う2つが赤くなる', cellAt(pairA).classList.contains('clash') && cellAt(pairB).classList.contains('clash'));
        check('照明の数が出る', $('lamps').textContent.includes('2'), $('lamps').textContent);

        // 5. 保存されている
        const saved = localStorage.getItem(`akari:v1:${DATE}:${LEVEL}`);
        check('途中経過が保存される', saved && JSON.parse(saved).s.includes('1'));

        // 6. やり直すで全部消える
        click($('reset'));
        await settle(1);
        check('やり直すで照明が消える', $('board').querySelectorAll('.cell.white.lamp').length === 0);

        // 7. まちがい探し（答えに無い照明を赤枠にする）
        const notLamp = ix.whites.find((i) => made.solution[i] !== akari.LAMP);
        click(cellAt(notLamp));
        click($('check'));
        await settle(1);
        check('まちがい探しが間違いを指す', cellAt(notLamp).classList.contains('wrong'));

        // 8. ヒント（間違いを1つ外す → 正しい照明を1つ置く）
        click($('hint'));
        await settle(1);
        check('ヒントが間違った照明を外す', !cellAt(notLamp).classList.contains('lamp'));
        click($('hint'));
        await settle(1);
        const given = $('board').querySelectorAll('.cell.white.given');
        check('ヒントが正解を1つ置く', given.length === 1 && given[0].classList.contains('lamp'));

        // 9. 答えどおりに置くとクリアになる
        click($('reset'));
        await settle(1);
        for (const i of lampCells) click(cellAt(i));
        await settle(1);
        check('全部置くとクリア判定が出る', !$('overlay').classList.contains('hidden'));
        check('クリアの見出し', $('overlay-title').textContent === 'クリア！', $('overlay-title').textContent);
        check('状態表示がクリア済み', $('state').textContent === 'クリア済み', $('state').textContent);
        check(
          '全部の白マスが点灯している',
          $('board').querySelectorAll('.cell.white.lit').length === whites,
        );
        check('クリア後は照らし合いが無い', $('board').querySelectorAll('.cell.white.clash').length === 0);

        // 10. 日付を戻すと別の問題になり、クリア状態は持ち越さない
        const before = $('board').innerHTML;
        click($('prev-day'));
        await settle();
        check('前日で問題が変わる', $('board').innerHTML !== before);
        check('前日は未クリア', $('overlay').classList.contains('hidden'));
        check('URL に日付と難易度が乗る', location.hash === `#${akari.todayString(new Date(2026, 7, 31))}/${LEVEL}`, location.hash);

        // 11. 戻ってくるとクリア済みが復元される
        location.hash = `#${DATE}/${LEVEL}`;
        await settle(8);
        check('クリア済みが保存から戻る', $('state').textContent === 'クリア済み', $('state').textContent);

        // 12. 今の問題を puzz.link 向けに書き出せる
        const pl = await import('../src/puzzlink.js');
        check(
          '書き出し URL が今の問題と一致',
          $('link-out').dataset.url === pl.toUrl(made.puzzle),
          $('link-out').dataset.url,
        );
        check('書き出し URL が puzz.link の形', /^https:\/\/puzz\.link\/p\?lightup\/7\/7\//.test($('link-out').dataset.url));

        // 13. puzz.link の URL を貼ると、その問題に切り替わる
        const other = akari.dailyPuzzle('2026-08-20', 'easy');
        const otherUrl = pl.toUrl(other.puzzle);
        $('link-input').value = otherUrl;
        click($('link-open'));
        await settle(10);
        check('読み込んだ問題に切り替わる', $('seedline').textContent.includes('読み込んだ問題'), $('seedline').textContent);
        check('URL に読み込んだ問題が乗る', location.hash.startsWith('#p/lightup/7/7/'), location.hash);
        check('「調べています」が消えている', $('busy').classList.contains('hidden'), $('busy').textContent);

        // 盤面が貼った問題どおりに描けているか（黒マスの位置と数字で照合）
        const on = $('board').querySelectorAll('.cell');
        let sameBoard = on.length === other.puzzle.w * other.puzzle.h;
        for (let i = 0; sameBoard && i < on.length; i++) {
          const c = other.puzzle.cells[i];
          const isBlackCell = on[i].classList.contains('black');
          if (isBlackCell !== (c !== akari.WHITE)) sameBoard = false;
          else if (isBlackCell && on[i].textContent !== (c >= 0 ? String(c) : '')) sameBoard = false;
        }
        check('貼った問題どおりの盤面になる', sameBoard);

        // 14. 読み込んだ問題も最後まで遊べる（答えどおり置くとクリア）
        const cellAt2 = (i) => $('board').querySelector(`.cell.white[data-i="${i}"]`);
        for (let i = 0; i < other.puzzle.w * other.puzzle.h; i++) {
          if (other.solution[i] === akari.LAMP) click(cellAt2(i));
        }
        await settle(2);
        check('読み込んだ問題でもクリアになる', $('overlay-title').textContent === 'クリア！' && !$('overlay').classList.contains('hidden'));

        // 15. 美術館ではない URL は断る（盤面は今のまま）
        const keep = location.hash;
        $('link-input').value = 'https://puzz.link/p?nurikabe/3/3/g';
        click($('link-open'));
        await settle(2);
        check('別の種類の URL は断る', $('link-msg').classList.contains('warn'), $('link-msg').textContent);
        check('断ったときは盤面を変えない', location.hash === keep, location.hash);

        // 16. 「今日」で日替わりに戻れる
        click($('today'));
        await settle(10);
        check('今日に戻れる', location.hash === `#${akari.todayString()}/${LEVEL}`, location.hash);

        // 17. 過去問一覧（アーカイブ）
        location.hash = `#${DATE}/${LEVEL}`;
        await settle(8);
        click($('archive-open'));
        await settle(2);
        const arc = $('archive');
        check('過去問ボタンで一覧が開く', !arc.classList.contains('hidden'));
        check('開いた月が今遊んでいる日の月', arc.querySelector('.archive-month').textContent === '2026年9月', arc.querySelector('.archive-month').textContent);
        check('曜日の見出しが7つ', arc.querySelectorAll('.archive-week span').length === 7);
        const days = arc.querySelectorAll('.archive-day[data-date]');
        check('その月の日数ぶんのマスが並ぶ', days.length === 30, `${days.length} 個`);

        const dayCell = (d) => arc.querySelector(`.archive-day[data-date="${d}"]`);
        check('クリア済みの日に印が付く', dayCell(DATE).classList.contains('done'), dayCell(DATE).className);
        check('クリアの印は ✓', dayCell(DATE).querySelector('.archive-mark').textContent === '✓');
        check('手つかずの日には印が無い', dayCell('2026-09-02').querySelector('.archive-mark').textContent === '');
        check(
          '今日より後の日は押せない',
          [...days].every((b) => b.dataset.date <= akari.todayString() || b.disabled),
        );
        check('集計が出る', /クリア \d+ \/ \d+日/.test(arc.querySelector('.archive-sum').textContent), arc.querySelector('.archive-sum').textContent);

        // 一覧は記録を読むだけで、問題を作らない（盤面はさっきのまま）
        check('一覧を開いても盤面は変わらない', location.hash === `#${DATE}/${LEVEL}`, location.hash);

        // 難易度を切り替えると、その難易度の記録に変わる
        const normalChip = [...arc.querySelectorAll('.archive-levels .chip')].find((b) => b.textContent.startsWith('ふつう'));
        click(normalChip);
        await settle(1);
        check('一覧の難易度を切り替えられる', normalChip.classList.contains('on'));
        check('別の難易度ではクリア印が消える', !dayCell(DATE).classList.contains('done'), dayCell(DATE).className);

        // 閉じるボタンで閉じる
        click(arc.querySelector('.archive-close'));
        await settle(1);
        check('閉じるで一覧が消える', arc.classList.contains('hidden'));

        // 18. 一覧から日を選ぶと、その日の問題が開く
        click($('archive-open'));
        await settle(2);
        click(dayCell('2026-09-03'));
        await settle(10);
        check('選んだ日が開く', location.hash === '#2026-09-03/easy', location.hash);
        check('選んだら一覧が閉じる', arc.classList.contains('hidden'));
        check('選んだ日の盤面が出ている', $('board').querySelectorAll('.cell').length === 49, `${$('board').querySelectorAll('.cell').length} マス`);

        // 19. 「まだ解いていない日へ」は今日から過去へ探す
        click($('archive-open'));
        await settle(2);
        click([...arc.querySelectorAll('.archive-levels .chip')].find((b) => b.textContent.startsWith('ふつう')));
        await settle(1);
        click(arc.querySelector('.archive-foot .btn'));
        await settle(10);
        check('未着手の日へ飛べる', location.hash === `#${akari.todayString()}/normal`, location.hash);

        finish(null);
      } catch (err) {
        finish(`${err && err.message}\n${err && err.stack}`);
      }
    </script>
  </body>
</html>
